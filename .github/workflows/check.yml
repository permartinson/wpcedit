# Runs npm run check (lint, tests, build and screen tests) on every push and
# pull request. ROM files are not available on GitHub, so the tests that need
# a ROM are skipped here; they run on your own computer (see .githooks/pre-push).
name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
