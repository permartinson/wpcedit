# Publishes the app on GitHub Pages (https://permartinson.github.io/wpcedit/).
# Runs only when started by hand: Actions → Deploy to GitHub Pages → Run workflow,
# on the main branch. It runs npm run check first, so a broken build is never
# published. ROM files are not on GitHub, so the tests that need a ROM are
# skipped here; they have already run on your computer before the push.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      # GitHub Pages shows 404.html for addresses it does not know, such as
      # /wpcedit/sprites after a reload; the app then opens the right view
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
